    <div id="disclaimer-modal" class="fixed inset-0 bg-black/50 backdrop-blur flex items-center justify-center z-50 hidden">
        <div class="modal-content max-w-[90%] w-[500px] max-h-[80vh] overflow-y-auto">

                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="disclaimer-content" class="modal-body text-gray-700 leading-relaxed text-base"></div>
        </div>
    </div>
    <div id="ocr-upload-modal" class="fixed inset-0 bg-black/50 backdrop-blur flex items-center justify-center z-50 hidden">
        <div class="modal-content max-w-[90%] w-[500px]">
            <div class="modal-header flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800">上传图片或题目</h3>
                <button class="text-gray-500 hover:text-gray-700 transition" aria-label="关闭OCR上传" onclick="closeModal('ocr-upload-modal')">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <div id="ocr-upload-initial">
                    <p class="text-base mb-5 text-gray-600">请选择有效的图片进行上传，图片将显示在对话中,模型将会参考图中内容进行回复（限制10MB以内）</p>
                    <div id="ocr-drag-drop-area" class="drag-drop-area">
                        <i class="fa-solid fa-cloud-arrow-up drag-drop-icon"></i>
                        <p class="drag-drop-text">拖拽图片到此处或点击上传</p>
                        <p class="drag-drop-hint">支持 JPG, PNG, GIF, WEBP 等格式</p>

                    </div>
                </div>
                <div id="ocr-upload-progress" class="hidden">
                    <div class="flex flex-col items-center gap-4">

                        <div id="ocr-progress-text" class="text-gray-600">正在上传图片...</div>

                    </div>
                </div>

                        </button>
                    </div>
                    <div class="flex justify-center">
                        <img id="ocr-preview-image" src="" alt="图片预览" class="max-w-full max-h-64 rounded-lg border border-gray-200" loading="lazy" decoding="async">

// externalSignal为可选的外部AbortSignal 用户主动停止时通过该信号中断请求
async function fetchWithRetry(url, options = {}, retries = MAX_RETRY_TIMES, externalSignal = null) {
    let lastError = null;
    for (let attempt = 0; attempt <= retries; attempt++) {
        if (externalSignal?.aborted) throw new DOMException('Aborted', 'AbortError');
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), NETWORK_TIMEOUT_MS);
        const onExternalAbort = () => controller.abort();
        if (externalSignal) externalSignal.addEventListener('abort', onExternalAbort);
        try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(timeoutId);
            if (externalSignal) externalSignal.removeEventListener('abort', onExternalAbort);
            return response;
        } catch (error) {
            clearTimeout(timeoutId);
            if (externalSignal) externalSignal.removeEventListener('abort', onExternalAbort);
            lastError = error;
            if (error.name === 'AbortError' || externalSignal?.aborted) throw error;
            if (attempt < retries) {
                await new Promise(r => setTimeout(r, RETRY_DELAY_BASE * Math.pow(2, attempt)));
                continue;
            }
            throw error;
        }
    }
    throw lastError || new Error('请求失败');
}

async function handleCodeFileUpload(file, containerDiv) {

            const reader = new FileReader();

function createMessageElement(side, text, avatar, messageIndex = -1, attachment = null) {

function editMessage(messageIndex) {
    if (messageIndex < 0 || messageIndex >= conversationHistory.length || typingEffectActive || isSubmitting) {
        showCopyFeedback('无法编辑该消息', true);
        return;
    }
    if (codeModeActive) {
        showCopyFeedback('代码编程模式中无法编辑消息，请先退出该模式', true);
        return;
    }
    if (typingEffectActive) stopAIResponse();
    originalConversationHistory = JSON.parse(JSON.stringify(conversationHistory));
    editingMessageIndex = messageIndex;
    userInput.value = conversationHistory[messageIndex].question || '';
    uploadedImage = null;
    uploadedFiles = [];
    updateAttachmentPreview();
    userInput.style.height = 'auto';
    userInput.style.height = `${Math.min(userInput.scrollHeight, 200)}px`;
    userInput.focus();
    conversationHistory.splice(messageIndex);
    const messages = chatMessages.querySelectorAll('.chat-message');
    const deleteStartIndex = Array.from(messages).findIndex(msg => parseInt(msg.dataset.messageIndex) === messageIndex);
    if (deleteStartIndex !== -1) {
        for (let i = messages.length - 1; i >= deleteStartIndex; i--) chatMessages.removeChild(messages[i]);

    updateSubmitButtonState();

    editingMessageIndex = -1;

    conversationHistory.forEach((item, idx) => {
        if (item.question || item.attachment) chatMessages.appendChild(createMessageElement('user', item.question, userAvatar, idx, item.attachment));
        const aiMsg = createMessageElement('ai', '', aiAvatar);
        const contentDiv = aiMsg.querySelector('.message-content');

        }
        chatMessages.appendChild(aiMsg);
    });
    userInput.value = '';

function parseTextAndCode(text) {
    const parts = [];
    const regex = /```([a-zA-Z]*)\n?([\s\S]*?)```/g;
    let lastIndex = 0, match;
    while ((match = regex.exec(text)) !== null) {

        parts.push({ type: 'code', language: match[1] || 'plaintext', content: match[2].trim() });
        lastIndex = regex.lastIndex;
    }
    if (lastIndex < text.length) parts.push({ type: 'text', content: text.substring(lastIndex) });

}

function renderStreamingMarkdown(container, text, isFinal = false) {

    const fenceMatches = renderText.match(/```/g);

    // 处理未闭合的行内代码反引号

    if (tickMatches && tickMatches.length % 2 === 1) renderText += '`';

    if (typeof marked !== 'undefined') {
        try { html = marked.parse(renderText); } catch (e) { html = escapeHtml(text).replace(/\n/g, '<br>'); }
    } else {
        html = escapeHtml(text).replace(/\n/g, '<br>');
    }
    container.innerHTML = html;
    // 将原生pre代码块包装为自定义代码块结构 补充语言标签与复制按钮
    container.querySelectorAll('pre').forEach(pre => {
        if (pre.parentElement && pre.parentElement.classList.contains('code-content')) return;
        const code = pre.querySelector('code');
        if (!code) return;
        const langMatch = (code.className || '').match(/language-([\w-]+)/);
        const lang = langMatch ? langMatch[1] : 'plaintext';
        const langLabel = lang.charAt(0).toUpperCase() + lang.slice(1);
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block';
        const header = document.createElement('div');
        header.className = 'code-header';

        const content = document.createElement('div');
        content.className = 'code-content';
        pre.parentNode.insertBefore(wrapper, pre);
        content.appendChild(pre);
        wrapper.appendChild(header);
        wrapper.appendChild(content);
        // 完成态或代码围栏已闭合时应用语法高亮 流式中也实时高亮已输入部分
        if (typeof hljs !== 'undefined') {

function typeWriterEffect(element, text, callback, showUI = true) {
    if (!element) { callback?.(); return; }
    const fullText = (text || '').replace(/^\s+/, '');
    element.innerHTML = '';
    typingEffectActive = true;
    if (showUI) {
        isSubmitting = true;
        submitBtn.classList.add('hidden');
        stopBtn.classList.remove('hidden');
        updateSubmitButtonState();
    }
    // 统一的Markdown渲染容器 边输出边渲染保持格式
    const mdDiv = document.createElement('div');
    mdDiv.className = 'markdown-content';
    element.appendChild(mdDiv);
    // 打字光标 使用现有typing-cursor样式
    let cursor = null;
    if (showUI) {
        cursor = document.createElement('span');
        cursor.className = 'typing-cursor';
        element.appendChild(cursor);
    }
    // 收尾处理 重置状态并触发回调
    const finish = (finalText) => {
        renderStreamingMarkdown(mdDiv, finalText, true);
        if (cursor) cursor.remove();
        typingEffectActive = false;
        if (showUI) {
            isSubmitting = false;
            submitBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            updateSubmitButtonState();
        }
        callback?.();
        scrollToBottom();
    };
    if (prefersReducedMotion) { finish(fullText); return; }
    let charIndex = 0;
    let lastRender = 0;
    const total = fullText.length;
    // 自适应批量大小 长文本加快输出速度 短文本保持逐字细腻感
    const batch = total > 4000 ? 8 : (total > 1500 ? 4 : 2);
    const RENDER_INTERVAL = 60; // 毫秒 节流Markdown重新渲染频率平衡性能与流畅度
    function typeStep() {
        // 用户主动停止 渲染已输入部分并收尾
        if (!typingEffectActive) { finish(fullText.substring(0, charIndex)); return; }
        // 输出完成 最终渲染并收尾
        if (charIndex >= total) { finish(fullText); return; }
        charIndex = Math.min(total, charIndex + batch);
        const now = performance.now();
        // 节流重新渲染 边输出边呈现Markdown格式
        if (now - lastRender >= RENDER_INTERVAL) {
            renderStreamingMarkdown(mdDiv, fullText.substring(0, charIndex), false);
            lastRender = now;
            if (isNearBottom && isFollowing) scrollToBottom();
        }
        requestAnimationFrame(() => setTimeout(typeStep, 12));
    }
    typeStep();
}

function verifyImageFile(file) {
    return new Promise(resolve => {
        if (file.name.toLowerCase().endsWith('.pdf')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const arr = new Uint8Array(e.target.result).subarray(0, 5);
                const header = String.fromCharCode.apply(null, arr);
                resolve(header === '%PDF-');
            };
            reader.onerror = () => resolve(false);
            reader.readAsArrayBuffer(file.slice(0, 5));
            return;
        }
        if (!file.type.startsWith('image/')) {
            resolve(false);
            return;
        }
        const url = URL.createObjectURL(file);
        const img = new Image();
        const timer = setTimeout(() => { URL.revokeObjectURL(url); resolve(false); }, 5000);
        img.onload = () => { clearTimeout(timer); URL.revokeObjectURL(url); resolve(true); };
        img.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(url); resolve(false); };
        img.src = url;
    });
}
async function handleOCRImageUpload(event) {
    const file = event.target.files?.[0];
    ocrFileInput.value = '';
    if (!file) return;
    const ext = file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : '';
    if (!UPLOAD_ALLOWED_EXT.includes(ext)) {
        showCopyFeedback('不支持的文件格式，请选择 JPG、PNG、GIF、WEBP 等图片文件', true);
        return;
    }
    if (file.size === 0) {
        showCopyFeedback('文件内容为空，请选择有效的图片', true);
        return;
    }
    if (file.size > UPLOAD_MAX_SIZE) {
        showCopyFeedback('图片大小不能超过10MB，请选择更小的图片', true);
        return;
    }
    document.getElementById('ocr-upload-initial')?.classList.add('hidden');
    document.getElementById('ocr-upload-progress')?.classList.remove('hidden');
    setUploadProgress(10, '正在校验文件...');
    const isValid = await verifyImageFile(file);
    if (!isValid) {
        failUpload('图片文件已损坏或无法解析，请更换图片');
        return;
    }
    setUploadProgress(20, '正在上传 0%');
    const formData = new FormData();
    formData.append('image', file);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', UPLOAD_URL);
    xhr.timeout = 30000;
    xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
            const percent = Math.round(e.loaded / e.total * 100);
            setUploadProgress(20 + percent * 0.7, `正在上传 ${percent}%`);
        }
    };
    xhr.onload = () => {
        let data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 200 && data && data.success && isValidUrl(data.url)) {
            uploadedImage = data.url;
            setUploadProgress(100, '上传完成');
            setTimeout(() => {
                document.getElementById('ocr-upload-progress')?.classList.add('hidden');
                document.getElementById('ocr-preview')?.classList.remove('hidden');
                const previewImg = document.getElementById('ocr-preview-image');
                if (previewImg) previewImg.src = data.url;
            }, 300);
            showCopyFeedback('图片上传成功');
        } else {
            failUpload((data && data.message) || '上传失败，请稍后重试');
        }
    };
    xhr.onerror = () => failUpload('网络连接异常，请检查网络后重试');
    xhr.ontimeout = () => failUpload('上传超时，请检查网络后重试');
    xhr.send(formData);
}
function useUploadedImage() {
    closeModal('ocr-upload-modal');
    uploadedFiles = [];

}
